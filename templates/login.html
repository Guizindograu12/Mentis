<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Mentis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>


<!-- =====================================
     CABEÇALHO
     ===================================== -->

<header class="header">

    <div class="logo">

        <img
            src="{{ url_for('static', filename='imagens/logo.png') }}"
            alt="Logo Mentis">

    </div>


    <nav class="menu">

        <a href="{{ url_for('home') }}#hero">
            Home
        </a>

        <a href="{{ url_for('home') }}#sobre">
            Sobre nós
        </a>

        <a href="{{ url_for('home') }}#demo">
            Demo
        </a>

        <a href="{{ url_for('home') }}#faq">
            FAQ
        </a>

        <a href="{{ url_for('home') }}#time">
            Nosso time
        </a>

    </nav>

</header>



<!-- =====================================
     CONTEÚDO
     ===================================== -->

<main class="container">


    <!-- =================================
         LADO ESQUERDO
         ================================= -->

    <section class="left">

        <div class="left-content">

            <div class="left-text">

                <h2 id="titulo-alternativo">
                    Já possui uma conta?
                </h2>

                <p id="texto-alternativo">
                     Entre para continuar utilizando a Mentis.
                </p>


                <button type="button" class="account-button" onclick="mostrarLogin()">

                    Entrar em uma conta

                </button>

            </div>

        </div>

    </section>

    <!-- =================================
         LADO DIREITO
         ================================= -->

    <section class="right">


        <!-- =================================
             CADASTRO
             ================================= -->

        <div
            id="cadastro-area"
            class="form-area">


            <h1>
                Criar conta
            </h1>


            <div class="facalog">

                <p>
                    Cadastre-se no Mentis
                </p>

            </div>


            {% if erro %}

                <div class="erro">
                    {{ erro }}
                </div>

            {% endif %}


            <form
                action="{{ url_for('cadastro') }}"
                method="POST">


                <div class="input">

                    <input
                        name="email"
                        type="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>


                <div class="input">

                    <input
                        name="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        required>

                </div>


                <button
                    type="submit"
                    class="entrar">

                    Cadastrar

                </button>


            </form>


            <div class="social">

                <img
                    src="{{ url_for('static', filename='imagens/google.png') }}"
                    alt="Google">


                <img
                    src="{{ url_for('static', filename='imagens/microsoft.png') }}"
                    alt="Microsoft">

            </div>


        </div>



        <!-- =================================
             LOGIN
             ================================= -->

        <div
            id="login-area"
            class="form-area escondido">


            <h1>
                Entrar
            </h1>


            <div class="facalog">

                <p>
                    Entre na sua conta Mentis
                </p>

            </div>


            {% if erro %}

                <div class="erro">
                    {{ erro }}
                </div>

            {% endif %}


            <form
                action="{{ url_for('entrar') }}"
                method="POST">


                <div class="input">

                    <input
                        name="email"
                        type="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>


                <div class="input">

                    <input
                        name="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        required>

                </div>


                <!-- =========================
                     NOVO BOTÃO
                     ========================= -->

                <a
                    href="{{ url_for('esqueci_senha') }}"
                    class="esqueci">

                    Esqueci minha senha

                </a>


                <button
                    type="submit"
                    class="entrar">

                    Entrar

                </button>


            </form>


            <div class="social">

                <img
                    src="{{ url_for('static', filename='imagens/google.png') }}"
                    alt="Google">


                <img
                    src="{{ url_for('static', filename='imagens/microsoft.png') }}"
                    alt="Microsoft">

            </div>


        </div>


    </section>

</main>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
