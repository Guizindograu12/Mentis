<header class="header">

    <!-- LOGO -->
    <div class="logo">
        <a href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='imagens/logo.png') }}"
                alt="Logo Mentis">
        </a>
    </div>

    <!-- BOTÃO HAMBÚRGUER: MOBILE -->
    <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-label="Abrir menu"
        aria-controls="menu-principal"
        aria-expanded="false">

        <span></span>
        <span></span>
        <span></span>

    </button>

    <!-- FUNDO ESCURO DA SIDEBAR -->
    <div
        class="menu-overlay"
        id="menu-overlay">
    </div>

    <!-- MENU PRINCIPAL -->
    <nav
        class="menu"
        id="menu-principal"
        aria-label="Menu principal">

        <!-- TOPO DA SIDEBAR -->
        <div class="sidebar-top">

            <span>Menu</span>

            <button
                type="button"
                class="menu-close"
                id="menu-close"
                aria-label="Fechar menu">

                &times;

            </button>

        </div>

        <!-- LINKS DE NAVEGAÇÃO -->
        <a href="{{ url_for('home') }}#hero">
            Home
        </a>

        <a href="{{ url_for('home') }}#sobre">
            Sobre nós
        </a>

        <a href="{{ url_for('home') }}#demo">
            Demo
        </a>

        <a href="{{ url_for('home') }}#faq">
            FAQ
        </a>

        <a href="{{ url_for('home') }}#time">
            Nosso time
        </a>

        <!-- LOGIN: aparece só para quem NÃO está logado -->
        {% if not usuario %}

            <div class="login">

                <a
                    href="{{ url_for('login') }}"
                    class="btn">

                    Login

                </a>

            </div>

        {% endif %}

    </nav>

    <!-- ÍCONE DA PESSOA: aparece só para quem está logado -->
    {% if usuario %}

        <button
            type="button"
            class="btn-conta"
            id="btn-conta"
            aria-label="Abrir painel da conta"
            aria-controls="painel-conta"
            aria-expanded="false">

            <svg
                viewBox="0 0 24 24"
                width="28"
                height="28"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">

                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>

            </svg>

        </button>

    {% endif %}

</header>

<!-- =====================================
PAINEL LATERAL DA CONTA
(fica FORA do <header> de propósito: o header usa
backdrop-filter, que atrapalha elementos "fixed" dentro dele)
==================================== -->

{% if usuario %}

    <!-- FUNDO ESCURO DO PAINEL -->
    <div
        class="conta-overlay"
        id="conta-overlay">
    </div>

    <!-- PAINEL -->
    <aside
        class="conta-painel"
        id="painel-conta"
        aria-label="Painel da conta"
        aria-hidden="true">

        <div class="conta-painel-topo">

            <span>Minha conta</span>

            <button
                type="button"
                class="conta-fechar"
                id="conta-fechar"
                aria-label="Fechar painel">

                &times;

            </button>

        </div>

        <!-- E-mail do usuário logado -->
        <p class="conta-email">{{ usuario }}</p>

        <!-- Opções da conta -->
        <nav
            class="conta-links"
            aria-label="Opções da conta">

            <a href="{{ url_for('perfil') }}">
                Meu perfil e resultados
            </a>

            <!-- Ainda não existe página de configurações -->
            <span class="conta-link-desativado">
                Configurações
                <small>em breve</small>
            </span>

        </nav>

        <!-- Sair fica no fim do painel -->
        <a
            href="{{ url_for('logout') }}"
            class="conta-sair">

            Sair

        </a>

    </aside>

{% endif %}

<!-- JAVASCRIPT DO MENU MOBILE -->
<script>
(function () {

    const botaoAbrir = document.getElementById("menu-toggle");
    const botaoFechar = document.getElementById("menu-close");
    const menu = document.getElementById("menu-principal");
    const overlay = document.getElementById("menu-overlay");

    // Interrompe caso os elementos não existam.
    if (!botaoAbrir || !botaoFechar || !menu || !overlay) {
        return;
    }

    // Abre a sidebar.
    function abrirMenu() {

        menu.classList.add("menu-aberto");
        overlay.classList.add("overlay-visivel");

        botaoAbrir.setAttribute("aria-expanded", "true");
        botaoAbrir.setAttribute("aria-label", "Fechar menu");

        document.body.classList.add("menu-bloqueado");

    }

    // Fecha a sidebar.
    function fecharMenu() {

        menu.classList.remove("menu-aberto");
        overlay.classList.remove("overlay-visivel");

        botaoAbrir.setAttribute("aria-expanded", "false");
        botaoAbrir.setAttribute("aria-label", "Abrir menu");

        document.body.classList.remove("menu-bloqueado");

    }

    // Eventos dos botões.
    botaoAbrir.addEventListener("click", abrirMenu);
    botaoFechar.addEventListener("click", fecharMenu);

    // Fecha ao clicar no fundo escuro.
    overlay.addEventListener("click", fecharMenu);

    // Fecha ao selecionar um link.
    menu.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", fecharMenu);

    });

    // Fecha ao pressionar Escape.
    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {
            fecharMenu();
        }

    });

    // Fecha ao voltar para o layout de computador.
    window.addEventListener("resize", function () {

        if (window.innerWidth > 800) {
            fecharMenu();
        }

    });

})();
</script>

<!-- JAVASCRIPT DO PAINEL DA CONTA -->
<script>
(function () {

    const botao = document.getElementById("btn-conta");
    const painel = document.getElementById("painel-conta");
    const overlay = document.getElementById("conta-overlay");
    const botaoFechar = document.getElementById("conta-fechar");

    // Se o usuário não está logado, esses elementos não existem.
    if (!botao || !painel || !overlay || !botaoFechar) {
        return;
    }

    // Abre o painel lateral.
    function abrirPainel() {

        painel.classList.add("conta-aberta");
        overlay.classList.add("conta-overlay-visivel");

        painel.setAttribute("aria-hidden", "false");
        botao.setAttribute("aria-expanded", "true");

        document.body.classList.add("conta-bloqueado");

        botaoFechar.focus();

    }

    // Fecha o painel lateral.
    function fecharPainel() {

        if (!painel.classList.contains("conta-aberta")) {
            return;
        }

        painel.classList.remove("conta-aberta");
        overlay.classList.remove("conta-overlay-visivel");

        painel.setAttribute("aria-hidden", "true");
        botao.setAttribute("aria-expanded", "false");

        document.body.classList.remove("conta-bloqueado");

        botao.focus();

    }

    // Clicar no ícone abre o painel.
    botao.addEventListener("click", abrirPainel);

    // Fecha pelo X, pelo fundo escuro ou pela tecla Escape.
    botaoFechar.addEventListener("click", fecharPainel);
    overlay.addEventListener("click", fecharPainel);

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {
            fecharPainel();
        }

    });

})();
</script>
