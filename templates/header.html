<header class="header">

    <!-- LOGO -->
    <div class="logo">
        <a href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='imagens/logo.png') }}"
                alt="Logo Mentis">
        </a>
    </div>

    <!-- BOTÃO HAMBÚRGUER: MOBILE -->
    <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-label="Abrir menu"
        aria-controls="menu-principal"
        aria-expanded="false">

        <span></span>
        <span></span>
        <span></span>

    </button>

    <!-- FUNDO ESCURO DA SIDEBAR -->
    <div
        class="menu-overlay"
        id="menu-overlay">
    </div>

    <!-- MENU PRINCIPAL -->
    <nav
        class="menu"
        id="menu-principal"
        aria-label="Menu principal">

        <!-- TOPO DA SIDEBAR -->
        <div class="sidebar-top">

            <span>Menu</span>

            <button
                type="button"
                class="menu-close"
                id="menu-close"
                aria-label="Fechar menu">

                &times;

            </button>

        </div>

        <!-- LINKS DE NAVEGAÇÃO -->
        <a href="{{ url_for('home') }}#hero">
            Home
        </a>

        <a href="{{ url_for('home') }}#sobre">
            Sobre nós
        </a>

        <a href="{{ url_for('home') }}#demo">
            Demo
        </a>

        <a href="{{ url_for('home') }}#faq">
            FAQ
        </a>

        <a href="{{ url_for('home') }}#time">
            Nosso time
        </a>

        <!-- LOGIN E PERFIL -->
        <div class="login">

            {% if usuario %}

                <a
                    href="{{ url_for('perfil') }}"
                    class="conta"
                    title="Abrir meu perfil">

                    {{ usuario }}

                </a>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn-sair">

                    Sair

                </a>

            {% else %}

                <a
                    href="{{ url_for('login') }}"
                    class="btn">

                    Login

                </a>

            {% endif %}

        </div>

    </nav>

</header>

<!-- JAVASCRIPT DO MENU MOBILE -->
<script>
(function () {

    const botaoAbrir = document.getElementById("menu-toggle");
    const botaoFechar = document.getElementById("menu-close");
    const menu = document.getElementById("menu-principal");
    const overlay = document.getElementById("menu-overlay");

    // Interrompe caso os elementos não existam.
    if (!botaoAbrir || !botaoFechar || !menu || !overlay) {
        return;
    }

    // Abre a sidebar.
    function abrirMenu() {

        menu.classList.add("menu-aberto");
        overlay.classList.add("overlay-visivel");

        botaoAbrir.setAttribute("aria-expanded", "true");
        botaoAbrir.setAttribute("aria-label", "Fechar menu");

        document.body.classList.add("menu-bloqueado");

    }

    // Fecha a sidebar.
    function fecharMenu() {

        menu.classList.remove("menu-aberto");
        overlay.classList.remove("overlay-visivel");

        botaoAbrir.setAttribute("aria-expanded", "false");
        botaoAbrir.setAttribute("aria-label", "Abrir menu");

        document.body.classList.remove("menu-bloqueado");

    }

    // Eventos dos botões.
    botaoAbrir.addEventListener("click", abrirMenu);
    botaoFechar.addEventListener("click", fecharMenu);

    // Fecha ao clicar no fundo escuro.
    overlay.addEventListener("click", fecharMenu);

    // Fecha ao selecionar um link.
    menu.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", fecharMenu);

    });

    // Fecha ao pressionar Escape.
    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {
            fecharMenu();
        }

    });

    // Fecha ao voltar para o layout de computador.
    window.addEventListener("resize", function () {

        if (window.innerWidth > 800) {
            fecharMenu();
        }

    });

})();
</script>
